<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEO Desk · 질문으로 확인하는 AI 노출</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body data-page="chat"><div class="app-shell">
<aside class="sidebar"><a class="logo" href="/" aria-label="GEO Desk 홈"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="2" width="26" height="26" rx="8" fill="currentColor"/><path d="M21 10a8 8 0 1 0 1 9v-4h-8" fill="none" stroke="white" stroke-width="2"/></svg><span>GEO <b>Desk</b></span></a><button id="new-chat" class="primary wide">새 질문 시작</button><div class="side-label">내 대화 기록</div><nav id="history" aria-label="대화 기록"><p class="muted small">저장된 대화가 없습니다.</p></nav><div class="sidebar-bottom"><span class="network"><span class="dot"></span>내부망 워크스페이스</span><a href="/admin" class="admin-link">관리자 설정 <span aria-hidden="true">↗</span></a></div></aside>
<main class="chat-main"><header class="topbar"><div><strong>질문 & GEO 분석</strong><span id="brand-label">분석 대상 미설정</span></div><div class="top-actions"><span id="connection" class="status">설정 확인 중</span><button id="export" class="text-button" disabled>대화 내보내기</button></div></header>
<div id="setup-banner" class="banner" hidden>API 키가 아직 등록되지 않았습니다. <a href="/admin">관리자 설정에서 연결하기</a></div>
<section id="messages" class="conversation" aria-label="채팅 대화" aria-live="polite"><div id="welcome" class="welcome"><div class="orbit" aria-hidden="true"><svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="25" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="35" cy="35" rx="12" ry="25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 29h48M11 41h48" stroke="currentColor" stroke-width="1.5"/><circle cx="54" cy="19" r="6" fill="currentColor"/></svg></div><h1>AI는 우리를<br>어떻게 소개할까요?</h1><p>고객이 물을 만한 질문을 입력하세요.<br>AI 답변 속 브랜드 언급과 인용 출처를 함께 살펴봅니다.</p><div class="suggestions"><button data-prompt="학교에서 사용할 AI 코딩 교육 프로그램을 추천해줘.">교육 프로그램 추천</button><button data-prompt="초보자를 위한 피지컬 컴퓨팅 교육 업체를 비교해줘.">업체 비교 질문</button><button data-prompt="좋은 AI 교육 프로그램을 고를 때 어떤 기준을 확인해야 해?">구매 전 탐색 질문</button></div><p class="welcome-foot">답변 관측 → 브랜드 언급·출처 확인 → GEO 개선안</p></div></section>
<div class="composer-area"><form id="chat-form" class="composer"><label for="question" class="sr-only">질문</label><textarea id="question" rows="2" maxlength="6000" placeholder="예: 고등학생을 위한 AI·코딩 교육 업체를 추천해줘." required></textarea><div class="composer-footer"><span id="model-label">웹 검색 기반 분석</span><button id="send" class="primary" type="submit">질문 보내기 <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 10h12M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button></div></form><div id="chat-error" class="error" role="alert" hidden></div><p class="composer-note">한 번의 응답에 대한 관측입니다. 전체 AI 검색 노출을 대표하지 않습니다. 질문은 OpenAI로 전송됩니다.</p></div>
</main></div></body></html>
